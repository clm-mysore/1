<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Request | Christ's Love Ministries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">
    <header class="bg-slate-900 border-b border-slate-800 p-5 text-center">
        <a href="index.html" class="text-yellow-500 font-serif font-bold text-xl">← Back to Home</a>
    </header>

    <section class="max-w-2xl mx-auto px-4 py-12 w-full">
        <div class="bg-slate-900 p-8 sm:p-10 rounded-3xl border border-slate-800 shadow-2xl">
            <div class="text-center mb-8">
                <span class="bg-green-500/20 text-green-400 text-xs font-bold px-3 py-1 rounded-full uppercase">
                    <i class="fa-brands fa-whatsapp mr-1"></i> Direct WhatsApp Connect
                </span>
                <h1 class="text-3xl font-serif font-bold text-white mt-3">Prayer Request</h1>
                <p class="text-slate-400 text-sm mt-2">Our prayer team led by Ruben Ranjith will intercede for your request. Send your prayer need directly via WhatsApp.</p>
            </div>

            <form onsubmit="sendWhatsApp(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">Your Full Name *</label>
                    <input type="text" id="pName" required placeholder="Enter your name" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">Phone / WhatsApp Number *</label>
                    <input type="tel" id="pPhone" required placeholder="e.g. +91 9980027875" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">Prayer Request Details *</label>
                    <textarea id="pMessage" rows="4" required placeholder="Describe your prayer need..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-yellow-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold p-4 rounded-xl text-base transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Send via WhatsApp (+91 9980027875)
                </button>
            </form>
        </div>
    </section>

    <script>
        function sendWhatsApp(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const phone = document.getElementById('pPhone').value;
            const msg = document.getElementById('pMessage').value;
            const text = `Prayer Request:%0AName: ${encodeURIComponent(name)}%0APhone: ${encodeURIComponent(phone)}%0AMessage: ${encodeURIComponent(msg)}`;
            window.open(`https://wa.me/919980027875?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
