<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Christ's Love Ministries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
    
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-5 text-center">
        <a href="index.html" class="text-yellow-500 font-serif font-bold text-xl">← Back to Home</a>
    </header>

    <!-- Gallery Section -->
    <section class="max-w-6xl mx-auto px-4 py-12 text-center">
        <span class="bg-yellow-500/10 text-yellow-400 text-xs font-bold px-3 py-1 rounded-full uppercase border border-yellow-500/30">
            Visual Archive
        </span>
        <h1 class="text-3xl sm:text-5xl font-serif font-bold text-white mt-3 mb-2">Ministry Moments</h1>
        <p class="text-slate-400 text-sm mb-8">A glimpse of divine worship, youth guidance, and community gatherings in Mysuru.</p>

        <!-- Direct Google Drive Embedded Photo Gallery -->
        <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 shadow-2xl overflow-hidden mb-8">
            <iframe src="https://drive.google.com/embeddedfolderview?id=1Hkq7P2m8uk2CtZAh9l-vHlvdd_oONTmA#grid" width="100%" height="600" frameborder="0" class="rounded-xl w-full" title="Christ's Love Ministries Photo Gallery" loading="lazy"></iframe>
        </div>

        <!-- Open in Google Drive Button -->
        <a href="https://drive.google.com/drive/folders/1Hkq7P2m8uk2CtZAh9l-vHlvdd_oONTmA?usp=sharing" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold px-8 py-4 rounded-xl shadow-lg transition text-sm">
            <i class="fa-brands fa-google-drive text-lg"></i>
            <span>Open Full Album in Google Drive</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i>
        </a>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-900 text-center py-6 border-t border-slate-800 text-xs text-slate-500 mt-12">
        <p>&copy; 2026 Christ's Love Ministries, Mysuru.</p>
    </footer>

</body>
</html>
