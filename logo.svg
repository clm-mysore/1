<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Circular text paths -->
    <!-- Top arc: R=205, center at 250,250 -->
    <path id="top-arc" d="M 65 250 A 185 185 0 1 1 435 250" fill="none" />
    <path id="bottom-arc" d="M 430 255 A 180 180 0 0 1 70 255" fill="none" />

    <!-- Gradients -->
    <radialGradient id="skyRays" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff8ed" />
      <stop offset="35%" stop-color="#fdf0d5" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <radialGradient id="divineGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#eab308" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="blueRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2264ad" />
      <stop offset="50%" stop-color="#1d5696" />
      <stop offset="100%" stop-color="#154277" />
    </linearGradient>

    <linearGradient id="woodCross" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65351a" />
      <stop offset="35%" stop-color="#8a4b24" />
      <stop offset="70%" stop-color="#552c13" />
      <stop offset="100%" stop-color="#3c1e0c" />
    </linearGradient>

    <radialGradient id="heartGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="25%" stop-color="#e61919" />
      <stop offset="60%" stop-color="#b91c1c" />
      <stop offset="90%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <linearGradient id="handGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#fba86f" />
      <stop offset="100%" stop-color="#c26e3c" />
    </linearGradient>

    <linearGradient id="handGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#fba86f" />
      <stop offset="100%" stop-color="#c26e3c" />
    </linearGradient>

    <!-- Drop shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35" />
    </filter>
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#450a0a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Ring Background -->
  <circle cx="250" cy="250" r="242" fill="url(#blueRingGrad)" stroke="#0f3057" stroke-width="7" />
  
  <!-- Outer Ring Inner Thin Border -->
  <circle cx="250" cy="250" r="172" fill="#ffffff" stroke="#1d5696" stroke-width="6" />

  <!-- Inner Picture Area -->
  <circle cx="250" cy="250" r="169" fill="url(#skyRays)" />

  <!-- Divine Rays radiating from center behind cross -->
  <g opacity="0.35">
    <polygon points="250,210 200,60 215,60" fill="#fde047" />
    <polygon points="250,210 285,60 300,60" fill="#fde047" />
    <polygon points="250,210 350,90 365,95" fill="#fde047" />
    <polygon points="250,210 135,95 150,90" fill="#fde047" />
    <polygon points="250,210 390,145 400,160" fill="#fde047" />
    <polygon points="250,210 100,160 110,145" fill="#fde047" />
    <polygon points="250,210 405,210 410,225" fill="#fde047" />
    <polygon points="250,210 90,225 95,210" fill="#fde047" />
    <polygon points="250,210 240,55 260,55" fill="#fde047" />
  </g>
  <circle cx="250" cy="200" r="110" fill="url(#divineGlow)" />

  <!-- White Robed Presence (Spiritual Background) -->
  <path d="M 120,380 C 150,280 180,210 220,170 C 235,155 265,155 280,170 C 320,210 350,280 380,380 Z" fill="#ffffff" opacity="0.75" />
  <path d="M 170,380 C 210,260 230,220 250,220 C 270,220 290,260 330,380 Z" fill="#f8fafc" opacity="0.8" />
  <!-- Fold lines of robe -->
  <path d="M 220,180 Q 235,260 210,360" stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.6" />
  <path d="M 280,180 Q 265,260 290,360" stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.6" />
  <path d="M 250,200 Q 250,280 250,380" stroke="#e2e8f0" stroke-width="3" fill="none" opacity="0.7" />

  <!-- Wooden Cross Behind Heart -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Beam -->
    <rect x="238" y="115" width="24" height="150" rx="3" fill="url(#woodCross)" stroke="#2b1406" stroke-width="1.5" />
    <!-- Horizontal Cross Beam -->
    <rect x="194" y="152" width="112" height="23" rx="3" fill="url(#woodCross)" stroke="#2b1406" stroke-width="1.5" />
    <!-- Cross wood highlights -->
    <line x1="242" y1="117" x2="242" y2="260" stroke="#b46f3d" stroke-width="1.5" opacity="0.6" />
    <line x1="196" y1="155" x2="304" y2="155" stroke="#b46f3d" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Loving Cupped Hands (Supportive Base) -->
  <g id="cuppedHands" filter="url(#shadow)">
    <!-- Left Arm/Cuff/Hand -->
    <path d="M 100,350 C 130,330 160,340 185,348 C 210,356 228,348 245,335 C 248,345 235,368 210,380 C 180,392 135,385 100,365 Z" fill="url(#handGradLeft)" />
    <!-- Left Hand Fingers cradling bottom of heart -->
    <path d="M 180,330 C 195,310 215,310 230,325 C 235,335 220,350 200,352 C 185,353 175,342 180,330 Z" fill="#fdb884" />
    <path d="M 160,325 C 175,305 195,308 210,322 C 212,332 195,345 180,345 C 168,345 158,338 160,325 Z" fill="#f6a267" opacity="0.7" />

    <!-- Right Arm/Cuff/Hand -->
    <path d="M 400,350 C 370,330 340,340 315,348 C 290,356 272,348 255,335 C 252,345 265,368 290,380 C 320,392 365,385 400,365 Z" fill="url(#handGradRight)" />
    <!-- Right Hand Fingers cradling bottom of heart -->
    <path d="M 320,330 C 305,310 285,310 270,325 C 265,335 280,350 300,352 C 315,353 325,342 320,330 Z" fill="#fdb884" />
    <path d="M 340,325 C 325,305 305,308 290,322 C 288,332 305,345 320,345 C 332,345 342,338 340,325 Z" fill="#f6a267" opacity="0.7" />

    <!-- Outstretched thumb & wrist palm shading -->
    <ellipse cx="250" cy="355" rx="30" ry="12" fill="#c26e3c" opacity="0.4" />
  </g>

  <!-- Sacred Heart of Christ -->
  <g id="sacredHeart" filter="url(#heartShadow)">
    <!-- Heart Shape -->
    <path d="M 250,225 C 235,185 175,180 170,235 C 166,275 210,315 250,348 C 290,315 334,275 330,235 C 325,180 265,185 250,225 Z"
          fill="url(#heartGrad)" stroke="#7f1d1d" stroke-width="2" />
    
    <!-- Heart Gloss & 3D Specular Highlight -->
    <path d="M 235,210 C 225,195 195,195 185,225 C 180,240 190,260 205,255 C 215,250 220,230 235,210 Z"
          fill="#ffffff" opacity="0.35" />
    <ellipse cx="210" cy="225" rx="14" ry="8" transform="rotate(-30 210 225)" fill="#ffffff" opacity="0.5" />
    
    <!-- Crown of Thorns wrapped around Heart -->
    <g id="crownOfThorns">
      <!-- Main vine twists -->
      <path d="M 172,250 C 190,270 230,285 250,283 C 270,285 310,270 328,250"
            stroke="#381e0d" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M 173,253 C 200,265 235,272 250,272 C 265,272 300,265 327,253"
            stroke="#65351a" stroke-width="3" fill="none" />
      <path d="M 175,246 C 205,280 295,280 325,246"
            stroke="#200f05" stroke-width="2.5" fill="none" />
      <!-- Sharp Thorns -->
      <!-- Thorn 1 -->
      <polygon points="195,260 190,246 200,258" fill="#381e0d" />
      <!-- Thorn 2 -->
      <polygon points="215,268 212,282 222,270" fill="#200f05" />
      <!-- Thorn 3 -->
      <polygon points="238,272 236,258 244,271" fill="#381e0d" />
      <!-- Thorn 4 -->
      <polygon points="262,272 264,258 256,271" fill="#200f05" />
      <!-- Thorn 5 -->
      <polygon points="285,268 288,282 278,270" fill="#381e0d" />
      <!-- Thorn 6 -->
      <polygon points="305,260 310,246 300,258" fill="#200f05" />
      <!-- Side spikes -->
      <polygon points="180,252 170,244 179,256" fill="#381e0d" />
      <polygon points="320,252 330,244 321,256" fill="#381e0d" />
    </g>
  </g>

  <!-- Circular Ring Text: CHRIST'S LOVE MINISTRIES (R) -->
  <text font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3.5">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      CHRIST'S LOVE MINISTRIES (R)
    </textPath>
  </text>

  <!-- Circular Ring Text: ★ MYSURU ★ -->
  <text font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="8">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      ★ MYSURU ★
    </textPath>
  </text>
</svg>
